<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" viewBox="0 0 1200 390" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Surface & Accent Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="52%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#131A26"/>
    </linearGradient>

    <linearGradient id="topGoldEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#D4AF37" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#F3D570" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#D4AF37" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="goldBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3D570"/>
      <stop offset="100%" stop-color="#B8922A"/>
    </linearGradient>

    <linearGradient id="pipeStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#30363D"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="65%" stop-color="#D4AF37" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3D570" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Architectural Dot Grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8B949E" opacity="0.28"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="0.5" y="0.5" width="1199" height="389" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Surface -->
    <rect width="1200" height="390" fill="url(#bgGrad)"/>
    <rect width="1200" height="390" fill="url(#dotGrid)" opacity="0.55"/>

    <!-- Ambient Gold Radial Glow behind Pipeline -->
    <ellipse cx="992" cy="195" rx="230" ry="185" fill="url(#ambientGlow)"/>

    <!-- Subtle Vertical Divider -->
    <line x1="786" y1="42" x2="786" y2="348" stroke="#21262D" stroke-width="1"/>

    <!-- Top Highlight Edge -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#topGoldEdge)"/>

    <!-- ===== LEFT EDITORIAL BLOCK ===== -->
    <!-- Main Name -->
    <text x="50" y="114" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="55" font-weight="700" letter-spacing="-0.6" fill="url(#nameGrad)">João Vitor Vargas Martins</text>

    <!-- Gold Accent Bar -->
    <rect x="50" y="136" width="96" height="4" rx="2" fill="url(#goldBarGrad)"/>

    <!-- Role Subtitle (2 lines for crisp +50% scale) -->
    <text x="50" y="186" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="0.2" fill="#E2E8F0">Engenheiro de Dados  ·  Desenvolvedor de Software</text>
    <text x="50" y="220" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="0.2" fill="#E6C25A">Co-Fundador @ QuadCode</text>

    <!-- Executive Tagline -->
    <text x="50" y="268" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">Transformando dados brutos em arquitetura escalável</text>
    <text x="50" y="296" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94A3B8">e soluções de negócio em produção.</text>

    <!-- Bottom Micro-Tags -->
    <text x="50" y="344" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="14.5" font-weight="600" letter-spacing="1.1" fill="#D4AF37" opacity="0.85">ETL PIPELINES  /  SQL &amp; DATABASES  /  PYTHON &amp; JAVA  /  AI AUTOMATION</text>

    <!-- ===== RIGHT DATA PIPELINE GRAPH ===== -->
    <g>
      <!-- Ambient Core Halo -->
      <circle cx="988" cy="195" r="68" fill="url(#nodeGlow)"/>

      <!-- Connection Paths: Inputs -> Core -->
      <path d="M 914 111 C 932 111, 928 184, 946 184" fill="none" stroke="url(#pipeStroke)" stroke-width="1.8"/>
      <path d="M 914 279 C 932 279, 928 206, 946 206" fill="none" stroke="url(#pipeStroke)" stroke-width="1.8"/>

      <!-- Connection Paths: Core -> Outputs -->
      <path d="M 1030 184 C 1048 184, 1044 111, 1062 111" fill="none" stroke="url(#pipeStroke)" stroke-width="1.8"/>
      <path d="M 1030 206 C 1048 206, 1044 279, 1062 279" fill="none" stroke="url(#pipeStroke)" stroke-width="1.8"/>

      <!-- Animated Data Pulses -->
      <circle r="3.5" fill="#F3D570">
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M 914 111 C 932 111, 928 184, 946 184"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#F3D570">
        <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M 914 279 C 932 279, 928 206, 946 206"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#F3D570">
        <animateMotion dur="2.6s" begin="0.65s" repeatCount="indefinite" path="M 1030 184 C 1048 184, 1044 111, 1062 111"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="0.65s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.5" fill="#F3D570">
        <animateMotion dur="2.6s" begin="1.95s" repeatCount="indefinite" path="M 1030 206 C 1048 206, 1044 279, 1062 279"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="2.6s" begin="1.95s" repeatCount="indefinite"/>
      </circle>

      <!-- Input Node 1: RAW DATA -->
      <g transform="translate(806, 88)">
        <rect width="108" height="46" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
        <circle cx="16" cy="23" r="3.5" fill="#38BDF8"/>
        <text x="62" y="27" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#CBD5E1">RAW DATA</text>
      </g>

      <!-- Input Node 2: APIs / SQL -->
      <g transform="translate(806, 256)">
        <rect width="108" height="46" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
        <circle cx="16" cy="23" r="3.5" fill="#38BDF8"/>
        <text x="62" y="27" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#CBD5E1">APIs / SQL</text>
      </g>

      <!-- Center Core Node: ETL / DB -->
      <g transform="translate(946, 161)">
        <rect width="84" height="68" rx="14" fill="#18150E" stroke="#D4AF37" stroke-width="1.6"/>
        <circle cx="42" cy="23" r="4.5" fill="#F3D570">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="42" y="48" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="13" font-weight="700" fill="#F3D570">ETL / DB</text>
      </g>

      <!-- Output Node 1: BI / METRICS -->
      <g transform="translate(1062, 88)">
        <rect width="116" height="46" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
        <circle cx="16" cy="23" r="3.5" fill="#D4AF37"/>
        <text x="66" y="27" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">BI / METRICS</text>
      </g>

      <!-- Output Node 2: AI & SAAS -->
      <g transform="translate(1062, 256)">
        <rect width="116" height="46" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.3"/>
        <circle cx="16" cy="23" r="3.5" fill="#34D399"/>
        <text x="66" y="27" text-anchor="middle" font-family="'Cascadia Code', 'Fira Code', Consolas, monospace" font-size="11" font-weight="600" fill="#E2E8F0">AI &amp; SAAS</text>
      </g>
    </g>
  </g>

  <!-- Crisp Card Border -->
  <rect x="0.5" y="0.5" width="1199" height="389" rx="16" fill="none" stroke="#21262D" stroke-width="1"/>
</svg>
