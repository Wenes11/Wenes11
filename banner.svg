<?xml version="1.0" encoding="UTF-8"?>
<svg width="100%" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="40%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>

    <!-- Gold glow filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Strong glow for title -->
    <filter id="titleGlow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#D4AF37" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for lines -->
    <filter id="lineGlow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path -->
    <clipPath id="svgClip">
      <rect width="900" height="160"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="160" fill="url(#bg)" clip-path="url(#svgClip)"/>

  <!-- ===== CIRCUIT LINES LEFT ===== -->
  <g opacity="0.6" filter="url(#lineGlow)" clip-path="url(#svgClip)">
    <!-- Horizontal backbone left -->
    <line x1="0" y1="40" x2="180" y2="40" stroke="#D4AF37" stroke-width="1.2">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <!-- Branch down -->
    <line x1="80" y1="40" x2="80" y2="90" stroke="#D4AF37" stroke-width="1"/>
    <line x1="80" y1="90" x2="130" y2="90" stroke="#D4AF37" stroke-width="1"/>
    <!-- Junction dot -->
    <circle cx="80" cy="40" r="2.5" fill="#D4AF37">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="90" r="2" fill="#D4AF37" opacity="0.8"/>

    <!-- Upper circuit -->
    <line x1="0" y1="15" x2="50" y2="15" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
    <line x1="50" y1="15" x2="50" y2="35" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
    <circle cx="50" cy="15" r="1.5" fill="#D4AF37" opacity="0.7"/>

    <!-- Small node cluster -->
    <rect x="140" y="33" width="12" height="12" fill="none" stroke="#D4AF37" stroke-width="0.8" rx="2" opacity="0.7"/>
    <line x1="152" y1="39" x2="180" y2="39" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

    <!-- Lower left trace -->
    <line x1="0" y1="120" x2="100" y2="120" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="120" x2="100" y2="100" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <line x1="100" y1="100" x2="145" y2="100" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <circle cx="100" cy="120" r="2" fill="#D4AF37" opacity="0.6"/>
  </g>

  <!-- ===== CIRCUIT LINES RIGHT ===== -->
  <g opacity="0.6" filter="url(#lineGlow)" clip-path="url(#svgClip)">
    <!-- Horizontal backbone right -->
    <line x1="720" y1="40" x2="900" y2="40" stroke="#D4AF37" stroke-width="1.2">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
    </line>
    <!-- Branch down -->
    <line x1="820" y1="40" x2="820" y2="90" stroke="#D4AF37" stroke-width="1"/>
    <line x1="770" y1="90" x2="820" y2="90" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="820" cy="40" r="2.5" fill="#D4AF37">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="770" cy="90" r="2" fill="#D4AF37" opacity="0.8"/>

    <!-- Upper right circuit -->
    <line x1="850" y1="15" x2="900" y2="15" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
    <line x1="850" y1="15" x2="850" y2="35" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>
    <circle cx="850" cy="15" r="1.5" fill="#D4AF37" opacity="0.7"/>

    <!-- Node cluster right -->
    <rect x="748" y="33" width="12" height="12" fill="none" stroke="#D4AF37" stroke-width="0.8" rx="2" opacity="0.7"/>
    <line x1="720" y1="39" x2="748" y2="39" stroke="#D4AF37" stroke-width="0.8" opacity="0.5"/>

    <!-- Lower right trace -->
    <line x1="800" y1="120" x2="900" y2="120" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <line x1="800" y1="100" x2="800" y2="120" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <line x1="755" y1="100" x2="800" y2="100" stroke="#D4AF37" stroke-width="1" opacity="0.4"/>
    <circle cx="800" cy="120" r="2" fill="#D4AF37" opacity="0.6"/>
  </g>

  <!-- ===== TRAVELLING DATA PULSE LEFT ===== -->
  <g clip-path="url(#svgClip)" filter="url(#goldGlow)">
    <circle cx="0" cy="40" r="3" fill="#ffffff" opacity="0.9">
      <animateMotion dur="2.5s" repeatCount="indefinite" path="M0,0 L180,0"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== TRAVELLING DATA PULSE RIGHT ===== -->
  <g clip-path="url(#svgClip)" filter="url(#goldGlow)">
    <circle cx="900" cy="40" r="3" fill="#ffffff" opacity="0.9">
      <animateMotion dur="2.5s" begin="1.2s" repeatCount="indefinite" path="M0,0 L-180,0"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== AMBIENT PARTICLES ===== -->
  <g clip-path="url(#svgClip)">
    <!-- Particle cluster left -->
    <circle cx="25" cy="70" r="1.5" fill="#D4AF37" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;65;70" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="110" r="1" fill="#D4AF37" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="15" cy="135" r="1.2" fill="#D4AF37" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Particle cluster right -->
    <circle cx="875" cy="70" r="1.5" fill="#D4AF37" opacity="0.5">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;75;70" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="855" cy="110" r="1" fill="#D4AF37" opacity="0.4">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="885" cy="135" r="1.2" fill="#D4AF37" opacity="0.3">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- Central floating dots -->
    <circle cx="440" cy="18" r="1.2" fill="#D4AF37" opacity="0.3">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="145" r="1" fill="#D4AF37" opacity="0.25">
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== TOP BORDER LINE (animated) ===== -->
  <line x1="0" y1="2" x2="900" y2="2" stroke="#D4AF37" stroke-width="2.5" opacity="0.9" filter="url(#lineGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- ===== BOTTOM BORDER LINE ===== -->
  <line x1="0" y1="158" x2="900" y2="158" stroke="#D4AF37" stroke-width="1.2" opacity="0.5"/>

  <!-- ===== CORNER ACCENTS ===== -->
  <!-- Top-left -->
  <polyline points="0,0 20,0 20,20" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.9"/>
  <!-- Top-right -->
  <polyline points="900,0 880,0 880,20" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.9"/>
  <!-- Bottom-left -->
  <polyline points="0,160 20,160 20,140" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.9"/>
  <!-- Bottom-right -->
  <polyline points="900,160 880,160 880,140" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.9"/>

  <!-- ===== MAIN TITLE ===== -->
  <text
    x="450" y="82"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="38"
    fill="#D4AF37"
    text-anchor="middle"
    letter-spacing="2"
    filter="url(#titleGlow)"
  >
    João Vitor Vargas Martins
    <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- ===== DECORATIVE DIVIDER ===== -->
  <g transform="translate(450, 98)" opacity="0.7">
    <line x1="-180" y1="0" x2="-20" y2="0" stroke="#D4AF37" stroke-width="0.8"/>
    <polygon points="-10,0 -6,-3 -6,3" fill="#D4AF37"/>
    <polygon points="10,0 6,-3 6,3" fill="#D4AF37"/>
    <line x1="20" y1="0" x2="180" y2="0" stroke="#D4AF37" stroke-width="0.8"/>
    <!-- Diamonds -->
    <rect x="-3" y="-3" width="6" height="6" fill="#D4AF37" transform="rotate(45 0 0)"/>
  </g>

  <!-- ===== SUBTITLE ===== -->
  <text
    x="450" y="125"
    font-family="'Arial', 'Helvetica Neue', Helvetica, sans-serif"
    font-weight="700"
    font-size="13"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="5"
    opacity="0.9"
  >
    ENGENHEIRO DE DADOS  ·  DESENVOLVEDOR DE SOFTWARE  ·  CO-FUNDADOR @QUADCODE
  </text>

  <!-- ===== SKILL TAGS (bottom) ===== -->
  <g font-family="'Arial', monospace" font-size="9" fill="#D4AF37" opacity="0.55" text-anchor="middle" letter-spacing="1.5">
    <text x="210" y="147">PYTHON</text>
    <text x="310" y="147">DATA ENGINEERING</text>
    <text x="450" y="147">· · ·</text>
    <text x="590" y="147">AUTOMATION</text>
    <text x="690" y="147">JAVA</text>
  </g>
</svg>
